<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Práctica 8 - Variables y geometría</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
let xSol, ySol, dSol;
let xLuna, yLuna, dLuna;
function setup() {
  createCanvas(720, 480);
  xSol = width * 0.45;
  ySol = height * 0.5;
  dSol = height * 0.30;   
  xLuna = width * 0.75;
  yLuna = ySol;
  dLuna = dSol / 6;
  background(0, 255, 255);
  //sol
  fill(252, 186, 3);
  circle(xSol, ySol, dSol);
  //luna
  fill(220, 225, 235);
  circle(xLuna, yLuna, dLuna);
  }
</script>
</body>
</html>
