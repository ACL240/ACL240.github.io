    <!DOCTYPE html>
    <html lang="es">
    <head>
    <meta charset="UTF-8">
    <title>Ejercicio 08 — else if y switch</title>
    </head>
    <body>
    <h1>Ejercicio 08 — Estructuras condicionales else if y switch</h1>
    <script>
    //Parte 1
    var tarea = window.prompt("¿Has entregado la tarea?");
    if (tarea == "si") {
        document.write("<p>Pefectoooo.</p>");
    } else if (tarea == "no") {
        document.write("<p>Entrégala.</p>");
    } else {document.write("<p>Por favor responde con si o no.</p>");}
    // Parte 2
    document.write("<hr>");
    document.write("<h2>Parte 2</h2>");
    // ejercicio 1
    document.write("<h3>Ejercicio 1</h3>");
    let numero = prompt("Mete un número:");
    if (numero > 0) {
        alert("El número es positivo");
    } else if (numero < 0) {
        alert("El número es negativo");
    } else {
        alert("El número es cero");
    }

    document.write("<p>El programa pide un número y comprueba si es positivo, negativo o cero.</p>");
    // EJERCICIO 2
    document.write("<h3>Ejercicio 2</h3>");
    let contraseña = prompt("tu contraseña:");
    if (contraseña === "secreto123") {
        document.write("<p>Contraseña correcta.</p>");
    } else {
        document.write("<p>Contraseña incorrecta. Inténtalo de nuevo.</p>");
    }
    document.write("<p>El programa compara la contraseña introducida con la contraseña correcta.</p>");
    // EJERCICIO 3
    document.write("<h3>Ejercicio 3</h3>");
    let valor = null;
    if (valor === null) {
        alert("El valor es nulo.");
    } else {
        alert("El valor no es nulo.");
    }

    document.write("<p>La variable valor contiene null y el programa comprueba si realmente es nula.</p>");
    // EJERCICIO 4
    document.write("<h3>Ejercicio 4</h3>");
    let num = parseInt(prompt("Mete un número:"));
    if (num > 0 && num % 2 === 0) {
        console.log("El número es positivo y par");
    } else if (num > 0 && num % 2 !== 0) {
        console.log("El número es positivo e impar");
    } else {
        console.log("El número no es positivo");
    }
    document.write("<p>El programa distingue entre número positivo par, positivo impar y otros casos.</p>");
    // Parte 3
    document.write("<hr>");
    document.write("<h2>Programa de helados con else if</h2>");
    var topping = window.prompt(
        "¿Qué topping quieres: oreo, kitkat, brownie, lacasitos u otro?"
    );
    var precio = 0.00;
    var helado = 1.90;
    var precioFinal = 0.00;
    if (topping == "oreo") {
        precio = 1;
    } else if (topping == "kitkat") {
        precio = 150;
    } else if (topping == "brownie") {
        precio = 0.75;
    } else if (topping == "lacasitos") {
        precio = 0.95;
    } else {
        document.write("<p>No tenemos este topping, lo siento.</p>");
        precio = 0;
    }
    precioFinal = helado + precio;
    document.write("<p>El helado cuesta " + precioFinal + " €</p>");
    
    // Parte 4
    document.write("<hr>");
    document.write("<h2>Programa de helados con switch</h2>");
    var topping2 = window.prompt(
        "¿Qué topping quieres: oreo, kitkat, brownie, lacasitos u otro?"
    );
    var precio2 = 0;
    var helado2 = 1.90;
    var precioFinal2 = 0;
    switch (topping2) {
    case "oreo":
     precio2 = 1;
     break;
    case "kitkat":
    precio2 = 1.50;
     break;
    case "brownie":
      precio2 = 0.75;
      break;
      case "lacasitos":
      precio2 = 0.95;
      break;
      default:
      document.write("<p>No tenemos este topping, lo sentimos.</p>");
      precio2 = 0;
    }
    precioFinal2 = helado2 + precio2;
    document.write("<p>El helado cuesta " + precioFinal2 + " €</p>");
    </script>
    </body>
    </html>
