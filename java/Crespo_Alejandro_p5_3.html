<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Práctica 3 - Figuras y rellenos</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
  createCanvas(400, 400);

  background(200);
  stroke(100, 60, 30);
  strokeWeight(3);
  fill(230, 190, 130);
  rect(80, 170, 240, 190);
  stroke(90, 45, 20);
  strokeWeight(3);
  fill(140, 80, 40);
  rect(165, 260, 70, 100);

  stroke(255, 220, 0);
  strokeWeight(5);
  point(220, 310);

  stroke(100, 60, 30);
  strokeWeight(5);
  fill(135, 220, 255);
  rect(100, 210, 60, 50);

  stroke(100, 60, 30);
  strokeWeight(2);
  line(130, 210, 130, 260);
  line(100, 235, 160, 235);

  stroke(100, 60, 30);
  strokeWeight(5);
  fill(135, 220, 255);
  rect(240, 210, 60, 50);
  
  strokeWeight(2);
  line(270, 210, 270, 260);
  line(240, 235, 300, 235);

  stroke(100, 40, 30);
  strokeWeight(3);
  fill(180, 50, 40);
  triangle(50, 175, 200, 70, 350, 175);
}
</script>
</body>
</html>
