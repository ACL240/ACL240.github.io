<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 10 Funciones y botones</title>
</head>
<body>
<h1>Ejercicio 10 Funciones y botones</h1>
<p>Hola, pulsa un botón.</p>
<button onclick="saludar()">Saludar</button>
<button onclick="sumarDosNumeros()">Sumar</button>
    <button onclick="calcularEdad()">Edad</button>
    <button onclick="comprobarMayorEdad()">Mayoría de edad</button>
    <button onclick="comprobarNota()">Comprobar Notas</button>
    <script>
    function saludar() {
    alert("Hola, ejecutaste la función saludar.");
        }
    function sumarDosNumeros() {
    var numero1 = Number(prompt("Introduce el primer número"));
    var numero2 = Number(prompt("Introduce el segundo número"));
    var suma = numero1 + numero2;
    alert("El resultado de la suma es: " + suma);
        }
        function calcularEdad() {
         var edad = Number(prompt("Introduce tu edad"));
    var anioActual = 2026;
    var fechaNacimiento = anioActual - edad;
    alert("Tu año de nacimiento es: " + fechaNacimiento);
        }
    function comprobarMayorEdad() {var edad = Number(prompt("Introduce tu edad"));
    if (edad >= 18) {
    alert("Eres mayor de edad.");
    } else {
    alert("Eres menor de edad.");
    }
    }
   function comprobarNota() {
  var nota = Number(prompt("Dime tu nota"));
  if (nota >= 5) {
  alert("Aprobaste.");
  } else {
  alert("Suspendiste.");
  }
  }
    </script>
</body>
</html>
