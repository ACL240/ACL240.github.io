<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ejercicio 09 — Heladería</title>
</head>
<body>
<h1>Ejercicio 09 — Heladería</h1>
<script>
var precioTotal = 0; 
var tamaño = prompt(
"Elige un tamaño:\n" +"- pequeño = 1 €\n" +"- mediano = 2 €\n" +"- grande = 3 €"
);
if (tamaño == "pequeño") {
precioTotal = precioTotal + 1;
} else if (tamaño == "mediano") {
          precioTotal = precioTotal + 2;
} else if (tamaño == "grande") {
precioTotal = precioTotal + 3;
} else {
alert("Tamaño no válido");
}
var sabor = prompt("Elige un sabor:\n" +"- vainilla (básico)\n" +"- chocolate (básico)\n" +"- pistacho (premium)\n" +"- turrón (premium)");
sabor = sabor.toLowerCase();
switch (sabor) {
case "vainilla":
precioTotal = precioTotal + 0;
break;
case "chocolate":
precioTotal = precioTotal + 0;
break;
case "pistacho":
precioTotal = precioTotal + 1;
break;
case "turrón":
precioTotal = precioTotal + 1;
                break;

            default:
                alert("Sabor no válido");

        }
var topping = prompt("Elige un topping:\n" +"- sirope = 0.3 €\n" +"- galleta = 0.3 €\n" +"- oreo = 0.5 €\n" +"- brownie = 0.5 €");
        topping = topping.toLowerCase();
        switch (topping) {
            case "sirope":
                precioTotal = precioTotal + 0.3;
                break;
            case "galleta":
                precioTotal = precioTotal + 0.3;
                break;
            case "oreo":
                precioTotal = precioTotal + 0.5;
                break;
            case "brownie":
                precioTotal = precioTotal + 0.5;
                break;
            default:
                alert("Topping no válido");
        }
 document.write(
  "<h1>El precio final de tu helado es: " +precioTotal +" €</h1>");
document.write(
            '<img src="https://pixabay.com/es/images/download/stocksnap-ice-cream-926426_1920.jpg" alt="Helado" width="300">'
        );
    </script>
</body>
</html>
