<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
<title>Práctica 4 - Circunferencias y arcos</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
    // Creo el lienzo de 400x400 píxeles.
    createCanvas(400, 400);

    // Dibuja el fondo blanco.
    background(255);

    // Dibuja la cabeza sin relleno y con un borde negro grueso.
    noFill();
    stroke(0);
    strokeWeight(25);
    circle(200, 200, 260);

    // Dibuja los dos ojos de color negro y sin contorno.
    fill(0);
    noStroke();
    circle(170, 165, 30);
    circle(270, 165, 30);

    // Dibuja la boca mediante un arco negro sin relleno.
    noFill();
    stroke(0);
    strokeWeight(3);
    arc(200, 205, 90, 72, -13, PI);
}
</script>
</body>
</html>
