<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Práctica 5 - Coche sencillo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<script>
function setup() {
createCanvas(800, 600);
background(180, 220, 240);
//Sol
noStroke();
fill(255, 220, 0);
circle(680, 100, 90);
//Montaña triángulop
stroke(70);
strokeWeight(2);
fill(100, 160, 110);
triangle(20, 390, 160, 220, 300, 390);
//Carretera
noStroke();
fill(90);
rect(0, 460, 800, 140);
//la raya
stroke(255);
strokeWeight(5);
line(0, 530, 800, 530);
// coche
stroke(0);
strokeWeight(7);
fill(200, 30, 30);
rect(210, 230, 380, 120);

// Ventanas
stroke(0);
strokeWeight(4);
fill(170, 220, 240);
rect(225, 245, 165, 90);
rect(410, 245, 165, 90);
strokeWeight(5);
line(400, 230, 400, 350);
//chapas
stroke(0);
strokeWeight(7);
fill(200, 30, 30);
rect(120, 350, 560, 110);
stroke(0);
strokeWeight(4);
line(400, 355, 400, 455);
//tiradores de las puertas
line(290, 385, 340, 385);
line(460, 385, 510, 385);
//Ruedas
stroke(0);
strokeWeight(6);
 fill(40);
ellipse(250, 455, 115, 115);
ellipse(550, 455, 115, 115);
fill(200);
ellipse(250, 455, 65, 65);
ellipse(550, 455, 65, 65);
fill(255, 255, 100);
ellipse(665, 385, 20, 30);
fill(255, 0, 0);
ellipse(135, 385, 20, 30);
//Arcoiris
noFill();
strokeWeight(6);
stroke(247, 147, 219);
arc(400, 190, 410, 160, PI, TWO_PI);
stroke(247, 0, 219);
arc(400, 190, 440, 190, PI, TWO_PI);
stroke(0, 147, 219);
arc(400, 190, 470, 220, PI, TWO_PI);
}
</script>
</body>
</html>
